name: Comerciales Mely - Video real sin audio
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Ejecucion exitosa que contiene el APK actualizado
        required: true
permissions:
  contents: read
  actions: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Descargar APK compilado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download '${{ inputs.build_run_id }}' -n Comerciales-Mely-Android -D mobile/output/android
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Grabar pruebas de la entrega
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2G
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r mobile/output/android/Comerciales-Mely-etapa3.apk
            python3 mobile/scripts/android-demo.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Comerciales-Mely-Video-Completo
          path: mobile/output/demo/
          retention-days: 30
